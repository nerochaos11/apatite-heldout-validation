<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>磷灰石分类结果交互地图</title>
<style>__LEAFLET_CSS__
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;color:#25343c}header{height:78px;padding:13px 22px;background:white;border-bottom:1px solid #cbd4d8}h1{font-size:20px;margin:0 0 6px;font-weight:600}header p{font-size:12px;margin:0;color:#5b6871}#map{position:absolute;left:284px;right:0;top:78px;bottom:0;background:#e8edf0}aside{position:absolute;left:0;top:78px;bottom:0;width:284px;overflow:auto;background:#fafbfc;padding:16px;border-right:1px solid #cbd4d8}h2{font-size:14px;margin:17px 0 9px}label{font-size:13px;display:flex;align-items:center;gap:8px;margin:9px 0;line-height:1.5}.dot{width:11px;height:11px;display:inline-block;border:1px solid #555;border-radius:50%;flex-shrink:0}button,select,input[type=search]{width:100%;padding:8px;border:1px solid #bfcbd1;background:white;border-radius:3px;font:inherit;font-size:12px;color:#25343c}button{cursor:pointer;margin:4px 0}button:hover{background:#edf2f5}.views{display:grid;grid-template-columns:1fr 1fr;gap:5px}.count{font-size:13px;line-height:1.8;padding:9px 0;border-bottom:1px solid #dce2e5}small{font-size:11px;line-height:1.65;color:#586870;display:block}#selection{font-size:12px;line-height:1.7;overflow-wrap:anywhere}.leaflet-popup-content{font-size:12px;line-height:1.6;max-height:380px;overflow:auto;margin:13px 15px}.leaflet-popup-content b{font-size:13px}.leaflet-control-attribution{font-size:9px!important}.north{position:absolute;z-index:700;right:14px;top:14px;color:white;background:#1f303b99;padding:4px 7px;font:15px Georgia,serif;text-align:center;pointer-events:none}.figure-mode header,.figure-mode aside{display:none}.figure-mode #map{inset:0}.figure-mode .leaflet-control-zoom{display:none}.figure-mode .north{font-size:12px;right:9px;top:9px;padding:3px 5px}.figure-mode .leaflet-control-attribution{font-size:8px!important}
</style></head><body><header><h1>磷灰石分类结果交互地图</h1><p>六元素组成分类结果与卫星影像底图联动，用于样品定位和结果复核。图上点位不等于新增矿床。</p></header>
<aside><small id="version"></small><div class="count" id="counts"></div><h2>连续缩放</h2><div class="views"><button data-view="global">全球</button><button data-view="regional">区域</button><button data-view="county">县域视野</button><button data-view="local">局部影像</button></div><h2>底图</h2><select id="basemap"><option value="satellite">Esri 卫星影像</option><option value="light">Carto 浅色底图</option><option value="none">无底图，仅点位</option></select><h2>预测类别</h2><div id="classes"></div><label><input type="checkbox" id="includeMatches">包含与主数据六元素重合的记录</label><small>默认隐藏数值重合记录；其余记录仍可能与主数据共享来源。概率为全量拟合模型的未校准输出。</small><h2>查找样品或来源</h2><input type="search" id="search" placeholder="输入样品名、来源或地点"><button id="export">导出当前显示记录 CSV</button><h2>点位复核</h2><div id="selection">点击地图点位，查看样品、元素、来源和输入行号。</div><h2>使用说明</h2><small>每个圆点代表一组坐标，扇区表示该坐标下记录的预测类别比例。点击可看分类记录数。原始坐标精度未经独立核验。卫星底图需联网；无网络时可选择“无底图”查看点位。缩放级别不表示预测精度。</small></aside>
<div id="map"><div class="north">N<br>↑</div></div><script>__LEAFLET_JS__</script><script>
'use strict';
const DATA=__MAP_DATA__, META=__MAP_META__;
const LABELS=['IOCG','Kiruna-type','Orogenic','Porphyry','Skarn','Unmineralized'];
const COLORS=['#B75E61','#D6AD51','#70A47A','#729DC1','#A48BB5','#79B9B5'];
const ESC=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VIEWS={global:{center:[18,0],zoom:2},regional:{center:[32,113],zoom:5},county:{center:[META.focus_lat,META.focus_lon],zoom:12},local:{center:[META.focus_lat,META.focus_lon],zoom:17}};
const figure=new URLSearchParams(location.search).has('figure');if(figure)document.body.classList.add('figure-mode');
const map=L.map('map',{preferCanvas:true,zoomSnap:.25,worldCopyJump:true,maxZoom:19,minZoom:1}).setView(VIEWS.global.center,2);
window.map=map;window.mapReady=false;window.tileStats={loaded:0,errors:0};
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri, Maxar, Earthstar Geographics',maxZoom:19,noWrap:true,crossOrigin:true});
const light=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors © CARTO',maxZoom:19,noWrap:true,crossOrigin:true});
let currentBase=satellite.addTo(map);for(const layer of [satellite,light]){layer.on('tileload',()=>window.tileStats.loaded++);layer.on('tileerror',()=>window.tileStats.errors++);}
L.control.scale({imperial:false,maxWidth:110}).addTo(map);
const pointLayer=L.layerGroup().addTo(map),focusLayer=L.layerGroup().addTo(map);
document.getElementById('version').textContent=META.model_version+' · 全量重拟合展示';
for(let i=0;i<LABELS.length;i++){const label=document.createElement('label');label.innerHTML=`<input type="checkbox" data-class="${LABELS[i]}" checked><span class="dot" style="background:${COLORS[i]}"></span>${LABELS[i]}`;document.getElementById('classes').append(label);}
const includeMatches=()=>document.getElementById('includeMatches').checked;
const rowCount=r=>includeMatches()?r.n:r.n_nonmatch;
const meanP=r=>includeMatches()?r.mean_p:r.mean_p_nonmatch;
function popup(r){const count=rowCount(r);return `<b>${ESC(r.class)}</b><br>坐标：${r.lat.toFixed(6)}, ${r.lon.toFixed(6)}<br>显示分析记录数：${count}；该坐标同类总数：${r.n}<br>与主数据六元素重合：${r.matches}<br>同类记录平均最大概率：${meanP(r)?.toFixed(4)}（未校准）<hr>样品示例：${r.samples.map(ESC).join('；')}<br>岩石：${r.rocks.map(ESC).join('；')}<br>地点：${r.locations.map(ESC).join('；')}<br>来源：${r.citations.map(ESC).join('；')}<br>六元素中位数（ppm）：${Object.entries(r.elements).map(([k,v])=>k+' '+Number(v).toPrecision(5)).join('；')}<br>输入CSV行号示例：${r.input_rows.slice(0,10).join(', ')}<br><small>样品、元素和行号示例覆盖该坐标同类总记录；完整逐记录结果见配套CSV。</small>`;}
let shown=[];
function sitePopup(rows){const n=rows.reduce((a,r)=>a+rowCount(r),0);return `<b>同坐标预测构成</b><br>坐标：${rows[0].lat.toFixed(6)}, ${rows[0].lon.toFixed(6)}<br>当前显示 ${n} 条分析记录<br>${rows.map(r=>r.class+': '+rowCount(r)).join('；')}<hr>`+rows.map(r=>`<details><summary>${ESC(r.class)} · n=${rowCount(r)}</summary>${popup(r)}</details>`).join('');}
function pieIcon(rows){const size=figure?16:20,c=size/2,r=c-1,total=rows.reduce((a,x)=>a+rowCount(x),0);let angle=-Math.PI/2,svg='';for(const q of rows){const f=rowCount(q)/total,col=COLORS[LABELS.indexOf(q.class)];if(f===1){svg+=`<circle cx="${c}" cy="${c}" r="${r}" fill="${col}"/>`;continue;}const next=angle+f*2*Math.PI,x0=c+r*Math.cos(angle),y0=c+r*Math.sin(angle),x1=c+r*Math.cos(next),y1=c+r*Math.sin(next);svg+=`<path d="M${c},${c} L${x0},${y0} A${r},${r} 0 ${f>.5?1:0},1 ${x1},${y1} Z" fill="${col}"/>`;angle=next;}return L.divIcon({className:'map-symbol',html:`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${svg}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="white" stroke-width="1"/></svg>`,iconSize:[size,size],iconAnchor:[c,c]});}
function render(){pointLayer.clearLayers();const enabled=new Set([...document.querySelectorAll('[data-class]:checked')].map(x=>x.dataset.class));const term=document.getElementById('search').value.trim().toLowerCase();shown=DATA.filter(r=>enabled.has(r.class)&&rowCount(r)>0&&(!term||JSON.stringify([r.samples,r.rocks,r.locations,r.citations,r.lat,r.lon]).toLowerCase().includes(term)));const sites=new Map();for(const r of shown){const key=r.lat+'|'+r.lon;if(!sites.has(key))sites.set(key,[]);sites.get(key).push(r);}for(const rows of sites.values()){const marker=L.marker([rows[0].lat,rows[0].lon],{icon:pieIcon(rows),zIndexOffset:rows.some(r=>r.class!=='Unmineralized')?200:0}).addTo(pointLayer);marker.bindPopup(()=>sitePopup(rows),{maxWidth:370});marker.bindTooltip(rows.map(r=>`${r.class}: ${rowCount(r)}`).join(' / '));marker.on('click',()=>document.getElementById('selection').innerHTML=sitePopup(rows));}const n=shown.reduce((a,r)=>a+rowCount(r),0);document.getElementById('counts').innerHTML=`输入 <b>${META.input_records.toLocaleString()}</b> 条 · 可显示坐标 <b>${META.mapped_records.toLocaleString()}</b> 条<br>当前显示 <b>${n.toLocaleString()}</b> 条 · <b>${sites.size}</b> 组坐标`;window.visibleSummary={records:n,coordinates:sites.size,groups:shown.length};}
function nextBounds(v){const z=v.zoom,p=map.project(v.center,z),half=L.point(map.getSize().x/2,map.getSize().y/2);return L.latLngBounds(map.unproject(p.subtract(half),z),map.unproject(p.add(half),z));}
window.setFigureView=function(name){const v=VIEWS[name];map.setView(v.center,v.zoom,{animate:false});focusLayer.clearLayers();const names=['global','regional','county','local'],i=names.indexOf(name);if(i>=0&&i<3)L.rectangle(nextBounds(VIEWS[names[i+1]]),{color:'#fff',weight:1.4,dashArray:'5 3',fill:false,interactive:false}).addTo(focusLayer);L.circleMarker([META.focus_lat,META.focus_lon],{radius:figure?9:11,color:'#111',weight:1.3,fill:false,interactive:false}).addTo(focusLayer);return {name,bounds:map.getBounds(),zoom:map.getZoom(),visible:window.visibleSummary};};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>window.setFigureView(b.dataset.view));
document.querySelectorAll('[data-class]').forEach(b=>b.onchange=render);document.getElementById('includeMatches').onchange=render;document.getElementById('search').oninput=render;
document.getElementById('basemap').onchange=()=>{if(currentBase)map.removeLayer(currentBase);currentBase=({satellite,light})[document.getElementById('basemap').value]||null;if(currentBase)currentBase.addTo(map);};
document.getElementById('export').textContent='导出当前点位清单 CSV';
document.getElementById('export').onclick=()=>{const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const rows=[['Latitude','Longitude','Predicted_Class','Displayed_Records','Mean_Uncalibrated_Max_Probability','Model_Version'],...shown.map(r=>[r.lat,r.lon,r.class,rowCount(r),meanP(r),META.model_version])];const csv='\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='地图当前点位清单.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
render();window.setFigureView('global');window.mapReady=true;
</script></body></html>
